<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainy.REN</title>
    <style>
        body {
            background-color: #080c14; /* พื้นหลังสีดำอมน้ำเงินเข้ม */
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2.5rem;
            background: rgba(13, 20, 35, 0.85);
            border: 2px solid #d4af37; /* กรอบสีทอง */
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); /* เงาสองเรืองแสงนิดๆ */
            max-width: 450px;
            width: 90%;
        }
        h1 {
            color: #d4af37; /* หัวข้อสีทอง */
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .mods-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .mod-btn {
            background-color: transparent;
            border: 1px solid #d4af37;
            color: #f8fafc;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .mod-btn:hover {
            background-color: #d4af37;
            color: #080c14;
            box-shadow: 0 0 10px #d4af37;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rainy.REN</h1>
        <p>Select your operational mode</p>
        
        <div class="mods-container">
            <button class="mod-btn" onclick="alert('Entering Talking Mode...')">💬 Talking Mode</button>
            <button class="mod-btn" onclick="alert('Entering Analyzing Mode...')">🧠 Analyzing Mode</button>
        </div>
    </div>
</body>
</html>
